name: Generate routes and deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate.sh'
      - 'index.html'
      - 'sitemap.xml'
      - 'route.css'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-routes
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/generate.sh

      - name: Run generator (deploy mode)
        run: ./scripts/generate.sh --deploy

      - name: Commit and push generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

          git add '*.html' sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-generate route pages + sitemap [skip actions]"
          git push

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/antalyakorsan
            git fetch origin main
            git reset --hard origin/main
            echo "Deployed $(git rev-parse --short HEAD)"
